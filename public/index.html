<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShareClone</title><link rel="stylesheet" href="style.css"></head><body><div id="nameModal" class="modal"><div class="card"><h2>Welcome to ShareClone</h2><p>Choose your display name.</p><input id="nameInput" maxlength="40" placeholder="Display name"><button id="continueBtn">Continue</button></div></div><aside><div class="brand">Share<span>Clone</span></div><div class="profile"><div id="avatar">?</div><div><b id="myName">Guest</b><small id="myId"></small></div></div><button class="nav active" data-tab="public">💬 Public Chat</button><button class="nav" data-tab="private">🔒 Private Chat</button><button class="nav" data-tab="people">👥 People</button><button class="nav" data-tab="share">🔗 Share Links</button><div class="sideBottom"><button id="changeName">✏️ Change name</button></div></aside><main><header><div><h1 id="title">Public Chat</h1><p id="subtitle">Everyone in this room can see these messages.</p></div><div class="status"><i></i><span id="count">0 online</span></div></header><section id="chat" class="chat"></section><section id="people" class="panel hidden"></section><section id="share" class="panel hidden"><h2>Room links</h2><p>Public link can be shared with anyone. The private link is a capability link; anyone who has it can see and send private messages.</p><label>Public link</label><div class="copyrow"><input id="publicLink" readonly><button data-copy="publicLink">Copy</button></div><label>Private link</label><div class="copyrow"><input id="privateLink" readonly><button data-copy="privateLink">Copy</button></div><button id="sharePrivate">Share private link</button></section><footer id="composer"><div id="replyBox" class="reply hidden"><span id="replyText"></span><button id="cancelReply">×</button></div><div class="compose"><input id="message" placeholder="Write a message..." maxlength="5000"><button id="send">Send</button></div></footer></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
